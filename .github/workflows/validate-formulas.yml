name: Validate Homebrew Formulae

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: Homebrew/actions/setup-homebrew@eb02c69dbabdb66ff183c614f4ce7ab3c077592c

      - name: Register the pull request checkout as a tap
        run: |
          brew tap --custom-remote ymauray/tap "file://${GITHUB_WORKSPACE}"
          for formula in Formula/*.rb; do
            brew trust --formula "ymauray/tap/$(basename "${formula%.rb}")"
          done

      - name: Check formula style
        run: brew style --formula --except-cops=FormulaAudit/Test ymauray/tap/{epubst,excelst,johannes,paige,scrubx,xtraktor}

      - name: Audit formulae
        run: brew audit --online --except=version --except-cops=FormulaAudit/Test ymauray/tap/{epubst,excelst,johannes,paige,scrubx,xtraktor}
